name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Every CI run used to generate a fresh debug keystore, so each build was
      # signed with a different key and installing over an older build failed
      # with "App not installed". Pin one keystore and reuse it forever.
      - name: Restore debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wingman-debug-keystore-v1

      - name: Create debug keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon

      - name: Stage APKs
        run: |
          mkdir -p out
          # Gradle output names are ambiguous (both modules emit app-debug.apk),
          # so stage them under their real product names.
          cp app/build/outputs/apk/debug/app-debug.apk out/Wingman.apk
          cp camera/build/outputs/apk/debug/camera-debug.apk out/HaloCamera.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: .

      - name: Attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Wingman.apk
            HaloCamera.apk
