name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon

      - name: Stage APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          cp camera/build/outputs/apk/debug/camera-debug.apk out/HaloCamera.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: .

      - name: Attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-debug.apk
            HaloCamera.apk
