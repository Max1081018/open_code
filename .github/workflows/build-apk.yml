name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Gradle reads this to sign both apps with one pinned key. See :app and
      # :camera build.gradle, signingConfigs.pinned.
      WINGMAN_KEYSTORE: ${{ github.workspace }}/.signing/wingman.jks
      WINGMAN_KEYSTORE_PASS: wingman
      WINGMAN_KEY_ALIAS: wingman
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Each run used to sign with a freshly generated debug key, so every APK
      # had a different signature and installing over an older build failed with
      # "App not installed". Pin one keystore and reuse it forever.
      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: .signing
          key: wingman-signing-keystore-v2

      - name: Create signing keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p .signing
          keytool -genkeypair -v \
            -keystore "$WINGMAN_KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$WINGMAN_KEYSTORE_PASS" -keypass "$WINGMAN_KEYSTORE_PASS" \
            -alias "$WINGMAN_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Wingman, O=Open Code, C=US"

      - name: Show signing certificate
        run: |
          keytool -list -v -keystore "$WINGMAN_KEYSTORE" \
            -storepass "$WINGMAN_KEYSTORE_PASS" -alias "$WINGMAN_KEY_ALIAS" \
            | grep -i "SHA256:" | head -1

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon

      - name: Verify APK is signed with the pinned keystore
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)/apksigner"
          # Cert SHA-256 fingerprints are 64 hex chars and keytool/apksigner may
          # print them colon-separated, so strip anything that is not hex first.
          APK_SHA=$("$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            | tr -d ':' \
            | tr 'A-F' 'a-f' \
            | grep -oiE '[0-9a-f]{64}' | head -1)
          KEY_SHA=$(keytool -list -v -keystore "$WINGMAN_KEYSTORE" \
            -storepass "$WINGMAN_KEYSTORE_PASS" -alias "$WINGMAN_KEY_ALIAS" \
            | tr -d ':' \
            | tr 'A-F' 'a-f' \
            | grep -oiE '[0-9a-f]{64}' | head -1)
          echo "APK signer : $APK_SHA"
          echo "Keystore   : $KEY_SHA"
          if [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::APK is not signed with the pinned keystore"
            exit 1
          fi
          echo "::notice::APK signed with the pinned keystore $APK_SHA"

      - name: Stage APKs
        run: |
          mkdir -p out
          # Gradle output names are ambiguous (both modules emit app-debug.apk),
          # so stage them under their real product names.
          cp app/build/outputs/apk/debug/app-debug.apk out/Wingman.apk
          cp camera/build/outputs/apk/debug/camera-debug.apk out/HaloCamera.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: .

      - name: Attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Wingman.apk
            HaloCamera.apk
