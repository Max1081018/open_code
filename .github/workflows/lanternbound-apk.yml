name: Ethereal Tales APK

# Builds the Godot game (godot/) into a signed Android APK and publishes it
# as a GitHub release, so each build has a direct download link.

on:
  push:
    branches: [ccr-60ac94c6-dyqxhw, main]
    paths:
      - "godot/**"
      - ".github/workflows/lanternbound-apk.yml"
  workflow_dispatch:

concurrency:
  group: lanternbound-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"
  GODOT_RELEASE: "4.4.1-stable"
  KEYSTORE: ${{ github.workspace }}/.signing/lanternbound.jks
  KEYSTORE_ALIAS: lanternbound
  KEYSTORE_PASS: lanternbound

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-templates-v1

      - name: Download Godot and Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot-bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          # Only the Android templates are needed.
          unzip -q templates.tpz 'templates/android_*' 'templates/version.txt' -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf godot.zip templates.tpz tpl
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Put Godot on the path
        run: |
          chmod +x ~/godot-bin/godot
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      # One pinned key, so every build installs over the last one.
      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: .signing
          key: lanternbound-signing-keystore-v1

      # The durable home of the key is a repository secret (the cache is
      # evicted after 7 unused days, and a new key would stop updates from
      # installing and change the Google sign-in fingerprint):
      #   base64 -w0 lanternbound.jks  ->  secret ANDROID_KEYSTORE_B64
      - name: Use the signing key from repository secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p .signing
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"

      - name: Create signing keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true' && hashFiles('.signing/lanternbound.jks') == ''
        run: |
          mkdir -p .signing
          keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -alias "$KEYSTORE_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Lanternbound, O=Open Code, C=US"

      - name: Configure the Godot editor for Android
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p ~/.config/godot ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storetype PKCS12 \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" || true
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.4.tres
          cat ~/.config/godot/editor_settings-4.4.tres
          ls "$SDK/build-tools" | tail -3

      # Importing ~4,000 assets (textures compressed for phones) is the slow
      # part: keep the import cache between builds.
      - name: Cache imported assets
        uses: actions/cache@v4
        with:
          path: godot/.godot
          key: godot-import-${{ env.GODOT_RELEASE }}-${{ hashFiles('godot/project.godot', 'godot/**/*.import') }}
          restore-keys: |
            godot-import-${{ env.GODOT_RELEASE }}-

      - name: Import the project
        run: |
          cd godot
          godot --headless --path . --import 2>&1 | tail -20 || true
          # A second pass resolves resources that depend on others imported
          # in the first.
          godot --headless --path . --import 2>&1 | tail -5 || true

      - name: Export the signed release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.KEYSTORE_PASS }}
        run: |
          mkdir -p out
          cd godot
          # Every build gets its own version code, so a phone installs it as
          # an update of the last one.
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.5.${{ github.run_number }}\"/" export_presets.cfg
          grep -E "^version/" export_presets.cfg
          godot --headless --path . --export-release "Android" "$GITHUB_WORKSPACE/out/EtherealTales.apk" 2>&1 | tail -40
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/EtherealTales.apk"

      - name: Verify the APK signature
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs out/EtherealTales.apk | head -5

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: EtherealTales-apk
          path: out/EtherealTales.apk
          if-no-files-found: error

      - name: Publish as a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ethereal-tales-build-${{ github.run_number }}
          name: Ethereal Tales build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Ethereal Tales, Android (arm64). Built from ${{ github.sha }} on ${{ github.ref_name }}.
            Install: download EtherealTales.apk on the phone and open it (allow installs from this source).
            Later builds are signed with the same key, so they install over this one.
          files: out/EtherealTales.apk
