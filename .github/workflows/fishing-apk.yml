name: Build Reel Trouble APK

# Exports the Godot game in fishing/ to an installable Android APK and uploads it
# as a run artifact. Trigger it from the Actions tab (Run workflow), or it runs
# automatically when the game changes.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the APK as a GitHub Release"
        type: boolean
        default: false
      version:
        description: "Release version (e.g. 0.6)"
        type: string
        default: "0.6"
  push:
    branches: ["main", "claude/**"]
    paths:
      - "fishing/**"
      - ".github/workflows/fishing-apk.yml"

env:
  GODOT_VERSION: "4.3"
  PROJECT_PATH: fishing
  EXPORT_NAME: ReelTrouble

permissions:
  contents: write     # needed to publish a Release when asked

jobs:
  export-android:
    runs-on: ubuntu-latest
    # This image ships Godot 4.3, the export templates, and the Android SDK/JDK.
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Debug keystore + editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          # Point Godot's Android exporter at the SDK, the JDK, and the keystore.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/root/android-sdk}}"
          JHOME="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v javac || command -v java)")")")}"
          echo "Android SDK: $SDK"
          echo "Java SDK:    $JHOME"
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JHOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export APK
        run: |
          mkdir -p build/android
          cd "$PROJECT_PATH"
          # Import once so resources (icon, shaders) are ready, then export.
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" "../build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelTrouble-Android
          path: build/android/*.apk
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reel-trouble-v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Reel Trouble v${{ inputs.version }} (Android)
          body: |
            Reel Trouble for Android. Download **ReelTrouble.apk** below on your phone,
            open it and allow installing from this source.

            Built from ${{ github.sha }}.
          files: build/android/ReelTrouble.apk
          make_latest: true
