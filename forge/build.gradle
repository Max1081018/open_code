plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Same pinned CI keystore as the other apps, so updates install over each other.
def ciKeystore = System.getenv("WINGMAN_KEYSTORE")

android {
    namespace 'dev.rustmodforge.app'
    compileSdk 34

    signingConfigs {
        if (ciKeystore != null) {
            pinned {
                storeFile file(ciKeystore)
                storePassword System.getenv("WINGMAN_KEYSTORE_PASS") ?: "wingman"
                keyAlias System.getenv("WINGMAN_KEY_ALIAS") ?: "wingman"
                keyPassword System.getenv("WINGMAN_KEYSTORE_PASS") ?: "wingman"
            }
        }
    }

    defaultConfig {
        applicationId "dev.rustmodforge.app"
        // java.time and modern zip handling in the engine.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            if (ciKeystore != null) signingConfig signingConfigs.pinned
        }
        release {
            minifyEnabled false
            signingConfig ciKeystore != null ? signingConfigs.pinned : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    // The conversion engine (included build ../forge-core, pure JVM).
    implementation 'dev.rustmodforge:forge-core:0.1.0'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    // Background conversions that survive leaving the app, with progress and cancel.
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    // Writing into a folder the user picked (Horizon Android's Mods folder).
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // Keystore-backed storage for AI and build-server keys.
    implementation 'androidx.security:security-crypto:1.1.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
