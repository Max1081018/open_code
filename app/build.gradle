plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// CI supplies a pinned keystore so every build is signed with the same key and
// installs over the previous one. Without the env var (a local run) Gradle falls
// back to its own debug signing.
def ciKeystore = System.getenv("WINGMAN_KEYSTORE")

android {
    namespace 'com.example.app'
    compileSdk 34

    signingConfigs {
        if (ciKeystore != null) {
            pinned {
                storeFile file(ciKeystore)
                storePassword System.getenv("WINGMAN_KEYSTORE_PASS") ?: "wingman"
                keyAlias System.getenv("WINGMAN_KEY_ALIAS") ?: "wingman"
                keyPassword System.getenv("WINGMAN_KEYSTORE_PASS") ?: "wingman"
            }
        }
    }

    defaultConfig {
        applicationId "com.example.app"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.7"
    }

    buildTypes {
        debug {
            if (ciKeystore != null) signingConfig signingConfigs.pinned
        }
        release {
            minifyEnabled false
            signingConfig ciKeystore != null ? signingConfigs.pinned : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Keystore-backed storage for the coach's API key.
    implementation 'androidx.security:security-crypto:1.1.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM so the coach parser can be unit tested.
    testImplementation 'org.json:json:20250107'
}
