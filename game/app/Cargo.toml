[package]
name = "deepdelve-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy frontend for Deepdelve: rendering, input, and camera."

[lib]
name = "deepdelve_app"
# "lib" for the desktop binary to link against, "cdylib" so Android gets a
# shared object exporting android_main.
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "deepdelve-app"
path = "src/main.rs"

[dependencies]
deepdelve-core = { path = "../core" }
# "wav" is not in Bevy's default features, and all the game's audio is
# synthesised into WAV at startup, so it has to be asked for.
bevy = { version = "0.20.1", features = ["wav"] }

# GameActivity is the entry point android_main is generated against. Not a
# default feature, so it must be asked for explicitly.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20.1", features = ["android-game-activity"] }
